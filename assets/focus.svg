<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="작업 방식: 기존 데이터에 연결, LLM 파이프라인 운영, 배포 후 응답 검증">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132E2F"/>
      <stop offset="1" stop-color="#0E2224"/>
    </linearGradient>
    <filter id="fblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      .sans { font-family: "Manrope", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif; }
      .mono { font-family: SFMono-Regular, Consolas, Menlo, "Liberation Mono", monospace; }
      .card { fill: url(#fbg); stroke: #284448; stroke-width: 1.5; }
      .num { font-size: 12px; letter-spacing: 2px; fill: #81D3AD; }
      .ttl { font-size: 21px; font-weight: 800; fill: #F4FBF6; }
      .sub { font-size: 14.5px; fill: #9DB8AE; }
      .ic { fill: none; stroke: #81D3AD; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .dim { stroke: #3F6460; }
      .chk { stroke-dasharray: 30; stroke-dashoffset: 30; animation: chk 4.5s ease-out infinite; }
      .k2 { animation-delay: .8s; } .k3 { animation-delay: 1.6s; }
      @keyframes chk { 0% { stroke-dashoffset: 30; } 15%, 80% { stroke-dashoffset: 0; } 95%, 100% { stroke-dashoffset: 30; } }
      .node { fill: #10262A; stroke: #81D3AD; stroke-width: 2; }
      .blink { animation: bl 2.4s ease-in-out infinite; }
      .b2 { animation-delay: .6s; } .b3 { animation-delay: 1.2s; } .b4 { animation-delay: 1.8s; }
      @keyframes bl { 0%, 100% { fill: #10262A; } 40% { fill: #81D3AD; } }
      .lock { animation: lk 3s ease-in-out infinite; }
      @keyframes lk { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- card 1: connect to existing data -->
  <rect class="card" x="1" y="1" width="378" height="268" rx="18"/>
  <g transform="translate(32 34)">
    <!-- db cylinder -->
    <ellipse class="ic" cx="30" cy="12" rx="26" ry="9"/>
    <path class="ic" d="M4 12 V58 C4 64, 56 64, 56 58 V12"/>
    <path class="ic dim" d="M4 28 C4 34, 56 34, 56 28 M4 43 C4 49, 56 49, 56 43"/>
    <g class="lock">
      <rect x="38" y="44" width="22" height="17" rx="3" fill="#10262A" stroke="#E8C872" stroke-width="2"/>
      <path d="M43 44 V39 a6 6 0 0 1 12 0 V44" fill="none" stroke="#E8C872" stroke-width="2"/>
    </g>
    <!-- arrow -->
    <path class="ic dim" d="M76 36 H150" stroke-dasharray="4 6"/>
    <path id="f1p" d="M76 36 H150" fill="none"/>
    <circle r="4" fill="#9CDDBF"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#f1p"/></animateMotion></circle>
    <!-- separate store -->
    <rect class="ic" x="160" y="12" width="108" height="48" rx="8"/>
    <text class="mono" x="214" y="41" text-anchor="middle" font-size="11" fill="#9CDDBF">preview_dev</text>
  </g>
  <text class="mono num" x="32" y="146">01</text>
  <text class="sans ttl" x="32" y="180">기존 데이터에 연결</text>
  <text class="sans sub" x="32" y="212">운영 DB는 읽기 전용으로 두고</text>
  <text class="sans sub" x="32" y="236">새 결과와 권한은 별도 영역에 분리</text>

  <!-- card 2: run llm pipeline -->
  <rect class="card" x="411" y="1" width="378" height="268" rx="18"/>
  <g transform="translate(442 30)">
    <path class="ic dim" d="M14 40 L84 14 M14 40 L84 66 M84 14 L154 40 M84 66 L154 40 M154 40 L224 40"/>
    <circle class="node blink" cx="14" cy="40" r="10"/>
    <circle class="node blink b2" cx="84" cy="14" r="10"/>
    <circle class="node blink b2" cx="84" cy="66" r="10"/>
    <circle class="node blink b3" cx="154" cy="40" r="10"/>
    <circle class="node blink b4" cx="224" cy="40" r="10"/>
    <text class="mono" x="84" y="94" text-anchor="middle" font-size="10.5" fill="#6F8C84">조사 ×2</text>
    <text class="mono" x="190" y="72" text-anchor="middle" font-size="10.5" fill="#6F8C84">작성 → 전망</text>
  </g>
  <text class="mono num" x="442" y="146">02</text>
  <text class="sans ttl" x="442" y="180">LLM 파이프라인 운영</text>
  <text class="sans sub" x="442" y="212">조사와 작성 단계를 나누고</text>
  <text class="sans sub" x="442" y="236">재시도·전송 횟수를 직접 기록</text>

  <!-- card 3: verify after deploy -->
  <rect class="card" x="821" y="1" width="378" height="268" rx="18"/>
  <g transform="translate(852 26)">
    <rect x="0" y="0" width="240" height="24" rx="6" fill="#10262A" stroke="#284448"/>
    <rect x="0" y="32" width="240" height="24" rx="6" fill="#10262A" stroke="#284448"/>
    <rect x="0" y="64" width="240" height="24" rx="6" fill="#10262A" stroke="#284448"/>
    <text class="mono" x="12" y="17" font-size="11" fill="#9DB8AE">GET /home/recommendations</text>
    <text class="mono" x="12" y="49" font-size="11" fill="#9DB8AE">GET /fixtures/{id}/document</text>
    <text class="mono" x="12" y="81" font-size="11" fill="#9DB8AE">section_result_id × 10</text>
    <path class="ic chk" d="M212 12 l6 6 l12 -12"/>
    <path class="ic chk k2" d="M212 44 l6 6 l12 -12"/>
    <path class="ic chk k3" d="M212 76 l6 6 l12 -12"/>
  </g>
  <text class="mono num" x="852" y="146">03</text>
  <text class="sans ttl" x="852" y="180">배포 후 응답 검증</text>
  <text class="sans sub" x="852" y="212">공개 API 응답을 저장 기록과</text>
  <text class="sans sub" x="852" y="236">결과 ID 단위로 대조</text>
</svg>
