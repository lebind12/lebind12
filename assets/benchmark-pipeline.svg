<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="BenchMark 프리뷰 생성 흐름: 수집, 입력 준비, 검색 조사 두 갈래, 자료 묶음 저장, 섹션 작성, AI 전망, 저장과 공개 조회, 독립 전송 장부">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1D1A"/>
      <stop offset="1" stop-color="#10262A"/>
    </linearGradient>
    <pattern id="pdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9CDDBF" fill-opacity=".07"/>
    </pattern>
    <filter id="pblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="pclip"><rect width="1200" height="540" rx="22"/></clipPath>
    <style>
      .mono { font-family: SFMono-Regular, Consolas, Menlo, "Liberation Mono", monospace; }
      .sans { font-family: "Manrope", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif; }
      .node { fill: #132E2F; stroke: #284448; stroke-width: 1.5; }
      .tag { font-size: 11.5px; letter-spacing: 2px; fill: #81D3AD; }
      .ttl { font-size: 18px; font-weight: 800; fill: #F4FBF6; }
      .sub { font-size: 13.5px; fill: #9DB8AE; }
      .wire { fill: none; stroke: #3F6460; stroke-width: 2; stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .chip { fill: #10262A; stroke: #2F5650; }
      .lit { animation: lit 4.8s ease-in-out infinite both; }
      .l2 { animation-delay: 1.2s; } .l3 { animation-delay: 2.4s; } .l4 { animation-delay: 3.6s; }
      @keyframes lit { 0%, 30%, 100% { fill: #10262A; stroke: #2F5650; } 8%, 20% { fill: #1D5244; stroke: #81D3AD; } }
      .search { fill: #10262A; stroke: #8CC8E0; stroke-opacity: .7; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pu 1.6s ease-out infinite; }
      @keyframes pu { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
      .ledger { fill: #0E2224; stroke: #E8C872; stroke-opacity: .55; stroke-dasharray: 5 5; }
      .row { fill: #E8C872; opacity: 0; animation: rw 6s linear infinite; }
      .r2 { animation-delay: 1.5s; } .r3 { animation-delay: 3s; } .r4 { animation-delay: 4.5s; }
      @keyframes rw { 0% { opacity: 0; } 8%, 70% { opacity: .9; } 85%, 100% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#pclip)">
    <rect width="1200" height="540" fill="url(#pbg)"/>
    <rect width="1200" height="540" fill="url(#pdots)"/>

    <!-- header -->
    <g class="sans">
      <text x="40" y="54" font-size="22" font-weight="800" fill="#F4FBF6">프리뷰 생성 흐름</text>
      <text x="214" y="54" font-size="14" fill="#6F8C84">수집 한 번이 공개 문서가 되기까지</text>
      <text x="1160" y="54" text-anchor="end" class="mono" font-size="13" fill="#6F8C84">FastAPI · LangGraph · Vertex AI (Gemini) · PostgreSQL</text>
    </g>

    <!-- wires (snake) -->
    <path class="wire" d="M150 165 H990"/>
    <path class="wire" d="M1010 240 V312"/>
    <path class="wire" d="M1030 380 H160"/>
    <path class="wire" d="M410 445 V470 M700 460 V470" stroke="#E8C872" stroke-opacity=".5"/>
    <path id="drop1" d="M410 445 V478" fill="none"/><path id="drop2" d="M700 455 V478" fill="none"/>

    <!-- packets (under nodes) -->
    <path id="snake" d="M150 165 H1010 V380 H150" fill="none"/>
    <g fill="#9CDDBF">
      <circle r="5"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#snake"/></animateMotion></circle>
      <circle r="11" filter="url(#pblur)" opacity=".55"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#snake"/></animateMotion></circle>
    </g>
    <g fill="#8CC8E0">
      <circle r="5"><animateMotion dur="7s" begin="1.75s" repeatCount="indefinite"><mpath href="#snake"/></animateMotion></circle>
      <circle r="11" filter="url(#pblur)" opacity=".55"><animateMotion dur="7s" begin="1.75s" repeatCount="indefinite"><mpath href="#snake"/></animateMotion></circle>
    </g>
    <g fill="#9CDDBF">
      <circle r="5"><animateMotion dur="7s" begin="3.5s" repeatCount="indefinite"><mpath href="#snake"/></animateMotion></circle>
      <circle r="11" filter="url(#pblur)" opacity=".55"><animateMotion dur="7s" begin="3.5s" repeatCount="indefinite"><mpath href="#snake"/></animateMotion></circle>
    </g>
    <g fill="#E8C872">
      <circle r="3.5"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#drop1"/></animateMotion></circle>
      <circle r="3.5"><animateMotion dur="1.5s" begin=".7s" repeatCount="indefinite"><mpath href="#drop2"/></animateMotion></circle>
      <circle r="5"><animateMotion dur="7s" begin="5.25s" repeatCount="indefinite"><mpath href="#snake"/></animateMotion></circle>
    </g>

    <!-- row 1 -->
    <g class="sans">
      <rect class="node" x="40" y="100" width="210" height="135" rx="14"/>
      <text class="tag mono" x="58" y="128">SOURCES</text>
      <text class="ttl" x="58" y="158">API-Football</text>
      <text class="sub" x="58" y="184">경기 · 팀 · 선수 데이터</text>
      <text class="sub" x="58" y="206">기사 · 공개 웹 자료</text>

      <rect class="node" x="290" y="100" width="210" height="135" rx="14"/>
      <text class="tag mono" x="308" y="128">COLLECT</text>
      <text class="ttl" x="308" y="158">수집 실행</text>
      <text class="sub" x="308" y="184">관리자 요청 → 백그라운드</text>
      <text class="sub" x="308" y="206">수집 후 생성 자동 연결</text>

      <rect class="node" x="540" y="100" width="210" height="135" rx="14"/>
      <text class="tag mono" x="558" y="128">INPUT · D0</text>
      <text class="ttl" x="558" y="158">입력 준비</text>
      <text class="sub" x="558" y="184">운영 DB 경기 문맥</text>
      <text class="sub" x="558" y="206">읽기 전용 연결</text>

      <rect class="node" x="790" y="90" width="370" height="150" rx="14"/>
      <text class="tag mono" x="808" y="118">RESEARCH · 병렬 2갈래</text>
      <rect class="search" x="808" y="132" width="334" height="40" rx="10"/>
      <text class="sub" x="824" y="157" fill="#D7ECF5">선수 · 부상 조사</text>
      <text class="mono" x="1128" y="157" text-anchor="end" font-size="11.5" fill="#8CC8E0">Google Search</text>
      <rect class="search" x="808" y="182" width="334" height="40" rx="10"/>
      <text class="sub" x="824" y="207" fill="#D7ECF5">외부 전망 조사</text>
      <text class="mono" x="1128" y="207" text-anchor="end" font-size="11.5" fill="#8CC8E0">Google Search</text>
    </g>

    <!-- row 2 (right to left) -->
    <g class="sans">
      <rect class="node" x="880" y="312" width="280" height="133" rx="14"/>
      <text class="tag mono" x="898" y="340">BUNDLE</text>
      <text class="ttl" x="898" y="370">근거 묶음 저장</text>
      <text class="sub" x="898" y="396">후보 URL 본문 수집</text>
      <text class="mono" x="898" y="420" font-size="12" fill="#9CDDBF">InformationBundle</text>

      <rect class="node" x="560" y="300" width="280" height="160" rx="14"/>
      <text class="tag mono" x="578" y="326">WRITE · 검색 도구 없음</text>
      <rect class="chip lit" x="578" y="338" width="244" height="24" rx="8"/>
      <text class="sub" x="592" y="355">주목 선수</text>
      <rect class="chip lit l2" x="578" y="366" width="244" height="24" rx="8"/>
      <text class="sub" x="592" y="383">부상 · 결장</text>
      <rect class="chip lit l3" x="578" y="394" width="244" height="24" rx="8"/>
      <text class="sub" x="592" y="411">외부 매체 전망</text>
      <rect class="chip lit l4" x="578" y="422" width="244" height="24" rx="8"/>
      <text class="sub" x="592" y="439">제공자 자료 조립 (모델 미사용)</text>

      <rect class="node" x="300" y="312" width="220" height="133" rx="14"/>
      <text class="tag mono" x="318" y="340">FINAL</text>
      <text class="ttl" x="318" y="370">AI 전망</text>
      <text class="sub" x="318" y="396">예상 스코어 · 근거</text>
      <text class="sub" x="318" y="418">필수 결과 판정</text>

      <rect class="node" x="40" y="312" width="220" height="133" rx="14" stroke="#81D3AD" stroke-opacity=".75"/>
      <text class="tag mono" x="58" y="340">SERVE</text>
      <circle class="pulse" cx="236" cy="336" r="4.5" fill="#81D3AD"/>
      <circle cx="236" cy="336" r="4.5" fill="#81D3AD"/>
      <text class="ttl" x="58" y="370">홈 공개 조회</text>
      <text class="mono" x="58" y="396" font-size="12" fill="#9CDDBF">preview_dev 저장본</text>
      <text class="sub" x="58" y="418">Vercel · Koyeb</text>
    </g>

    <!-- ledger -->
    <rect class="ledger" x="40" y="470" width="1120" height="44" rx="12"/>
    <text class="mono" x="60" y="497" font-size="12.5" fill="#E8C872">LEDGER</text>
    <text class="sans" x="128" y="497" font-size="13.5" fill="#C9BE97">모델 전송마다 예약 → 결과를 실행 트랜잭션과 별도로 커밋 · 롤백돼도 사용량이 남음</text>
    <g>
      <rect class="row" x="900" y="484" width="44" height="16" rx="4"/>
      <rect class="row r2" x="952" y="484" width="44" height="16" rx="4"/>
      <rect class="row r3" x="1004" y="484" width="44" height="16" rx="4"/>
      <rect class="row r4" x="1056" y="484" width="44" height="16" rx="4"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="539" rx="22" fill="none" stroke="#284448"/>
</svg>
